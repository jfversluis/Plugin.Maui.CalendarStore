# Copilot Coding Agent Setup Steps
# This workflow installs dependencies needed to build and validate changes.
# See: https://docs.github.com/en/copilot/customizing-copilot/adding-copilot-coding-agent-setup-steps

name: "Copilot Setup"

on: workflow_dispatch

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build plugin
        run: dotnet build src/Plugin.Maui.CalendarStore/Plugin.Maui.CalendarStore.csproj -c Release

      - name: Build sample
        run: dotnet build samples/Plugin.Maui.CalendarStore.Sample/Plugin.Maui.CalendarStore.Sample.csproj -c Release
